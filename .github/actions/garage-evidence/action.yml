name: Publish Garage evidence
description: Summarize a Garage run and upload only its sanitized evidence files
inputs:
  artifact-name:
    description: Name of the evidence artifact
    required: true
  retention-days:
    description: Artifact retention in days
    required: true
runs:
  using: composite
  steps:
    - name: Add capability report to job summary
      if: always()
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/summarize.sh"
    - name: Upload sanitized Garage evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          garage-output/**/capability-report.md
          garage-output/**/garage-run.json
          garage-output/**/README.md
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}
