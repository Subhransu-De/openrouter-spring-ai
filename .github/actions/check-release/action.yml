name: Verify release packaging and consumers
description: Build release artifacts locally and consume the starter with Maven and Gradle
inputs:
  version:
    description: Non-SNAPSHOT version to test
    required: true
runs:
  using: composite
  steps:
    # install stops before deploy, so this rehearsal never uploads to Central.
    - name: Build unsigned release artifacts in a fresh local repository
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: >-
        mvn -B -ntp -Prelease -pl '!openrouter-spring-ai-samples'
        "-Drevision=$VERSION" -Dgpg.skip=true
        "-Dmaven.repo.local=$RUNNER_TEMP/release-repository" clean install
    - name: Verify published Maven and Gradle metadata
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        metadata_dir="$RUNNER_TEMP/release-metadata"
        mkdir -p "$metadata_dir"
        for artifact in openrouter-spring-ai-parent openrouter-spring-ai openrouter-spring-ai-autoconfigure openrouter-spring-ai-starter; do
          mvn -B -ntp -f "$RUNNER_TEMP/release-repository/de/subhransu/$artifact/$VERSION/$artifact-$VERSION.pom" \
            "-Dmaven.repo.local=$RUNNER_TEMP/release-repository" -N help:effective-pom \
            "-Doutput=$metadata_dir/$artifact.xml"
        done
        gradle --no-daemon generatePomFileForMavenJavaPublication
        python3 release-smoke-tests/check_metadata.py "$metadata_dir"/*.xml \
          openrouter-spring-ai/build/publications/mavenJava/pom-default.xml \
          openrouter-spring-ai-autoconfigure/build/publications/mavenJava/pom-default.xml \
          openrouter-spring-ai-starter/build/publications/mavenJava/pom-default.xml
    - name: Test Maven consumer
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: >-
        mvn -B -ntp -f release-smoke-tests/pom.xml
        "-DreleaseVersion=$VERSION" "-DreleaseRepository=file://$RUNNER_TEMP/release-repository"
        "-Dmaven.repo.local=$RUNNER_TEMP/consumer-m2" verify
    - name: Test Gradle consumer
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: >-
        gradle --no-daemon -p release-smoke-tests
        "-PreleaseVersion=$VERSION" "-PreleaseRepository=file://$RUNNER_TEMP/release-repository" run
