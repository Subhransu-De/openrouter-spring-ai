name: Run Garage
description: Run the built Garage with a scoped inference key and literal arguments
inputs:
  key-name:
    description: Name of the scoped secret, for missing-key diagnostics
    required: true
  arguments:
    description: One literal command-line argument per line; empty lines are ignored
    required: true
  image-quality:
    description: Optional image quality for the weekly probe
    default: ''
runs:
  using: composite
  steps:
    - name: Run compatibility checks
      shell: bash
      env:
        GARAGE_KEY_NAME: ${{ inputs.key-name }}
        GARAGE_ARGUMENTS: ${{ inputs.arguments }}
        GARAGE_IMAGE_QUALITY: ${{ inputs.image-quality }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
