version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 100
    groups:
      spotbugs:
        patterns:
          - "com.github.spotbugs:spotbugs"
          - "com.github.spotbugs:spotbugs-maven-plugin"
    assignees:
      - "Subhransu-De"
    cooldown:
      default-days: 15
      include:
        - "com.puppycrawl.tools:checkstyle"

  # Full commit pins retain same-line release comments for Dependabot updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    assignees:
      - "Subhransu-De"
