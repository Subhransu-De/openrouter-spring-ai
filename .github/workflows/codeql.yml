name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    name: CodeQL availability
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.private && vars.CODEQL_ENABLED != 'true' }}

    steps:
      - name: Explain skipped CodeQL upload
        run: |
          echo "Native GitHub code scanning is not enabled for this private repository."
          echo "Set the repository variable CODEQL_ENABLED=true after enabling GitHub Code Security/code scanning."

  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build library production code for CodeQL
        # Manual Java extraction follows compilation: omit Garage and do not compile tests.
        run: >-
          mvn -B
          -pl openrouter-spring-ai,openrouter-spring-ai-autoconfigure,openrouter-spring-ai-starter
          -am -Dmaven.test.skip=true clean package

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
