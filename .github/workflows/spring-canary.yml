name: Spring Compatibility Canary

on:
  schedule:
    # Mondays at 04:00 UTC so upstream Spring AI milestones and RCs surface early.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      spring-ai-version:
        description: Spring AI version to test (blank resolves highest version on Maven Central, including milestones and RCs)
        required: false
        type: string
      spring-boot-version:
        description: Spring Boot version to pair with it (blank reads spring-boot-autoconfigure from Spring AI's POM)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  canary:
    name: Verify against Spring AI pre-release or latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Omit setup-java's maven cache so pre-release jars do not pollute the shared pom.xml cache key.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve Spring AI and paired Spring Boot versions
        id: resolve
        env:
          INPUT_AI: ${{ inputs.spring-ai-version }}
          INPUT_BOOT: ${{ inputs.spring-boot-version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version_re='^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$'
          ai_version="$INPUT_AI"
          if [[ -z "$ai_version" ]]; then
            # Pick the highest Spring AI version using Maven pre-release ordering (M < RC < GA),
            # rather than assuming maven-metadata.xml is sorted when older lines get patches.
            ai_version=$(curl -fsSL https://repo1.maven.org/maven2/org/springframework/ai/spring-ai-bom/maven-metadata.xml \
              | python3 -c '
          import re, sys, xml.etree.ElementTree as ET
          versions = [e.text.strip() for e in ET.fromstring(sys.stdin.read()).findall("./versioning/versions/version") if e.text and e.text.strip()]
          def key(v):
              m = re.match(r"^(\d+)\.(\d+)\.(\d+)(?:[.-]([A-Za-z]+)(\d*))?$", v)
              if not m:
                  return (-1, 0, 0, (0, ""), 0, v)
              maj, min_, pat, q, qn = m.groups()
              ql = (q or "").lower()
              if q is None:
                  rank = (4, "")
              elif ql in ("rc", "cr"):
                  rank = (3, "")
              elif ql in ("m", "milestone"):
                  rank = (2, "")
              elif ql == "snapshot":
                  rank = (0, "")
              else:
                  rank = (1, ql)
              return (int(maj), int(min_), int(pat), rank, int(qn or 0), v)
          print(max(versions, key=key) if versions else "")
          ')
          fi
          if [[ ! "$ai_version" =~ $version_re ]]; then
            echo "Invalid or unresolved Spring AI version: ${ai_version}"
            exit 1
          fi

          boot_version="$INPUT_BOOT"
          if [[ -z "$boot_version" ]]; then
            boot_version=$(curl -fsSL "https://repo1.maven.org/maven2/org/springframework/ai/spring-ai-autoconfigure-retry/${ai_version}/spring-ai-autoconfigure-retry-${ai_version}.pom" \
              | awk '
                  /<dependency>/ { in_dep=1; grp=""; art=""; ver="" }
                  in_dep && /<groupId>/ { line=$0; gsub(/.*<groupId>|<\/groupId>.*/, "", line); grp=line }
                  in_dep && /<artifactId>/ { line=$0; gsub(/.*<artifactId>|<\/artifactId>.*/, "", line); art=line }
                  in_dep && /<version>/ { line=$0; gsub(/.*<version>|<\/version>.*/, "", line); ver=line }
                  /<\/dependency>/ {
                    if (grp == "org.springframework.boot" && art == "spring-boot-autoconfigure" && ver != "") {
                      print ver
                      exit
                    }
                    in_dep=0
                  }
                ')
          fi
          if [[ ! "$boot_version" =~ $version_re ]]; then
            echo "Invalid or unresolved paired Spring Boot version for Spring AI ${ai_version}: ${boot_version}"
            exit 1
          fi

          baseline_ai=$(sed -n 's|.*<spring-ai.version>\([^<]*\)</spring-ai.version>.*|\1|p' pom.xml | head -n 1)
          baseline_boot=$(sed -n 's|.*<spring-boot.version>\([^<]*\)</spring-boot.version>.*|\1|p' pom.xml | head -n 1)
          skip='false'
          if [[ "$EVENT_NAME" == 'schedule' && "$ai_version" == "$baseline_ai" && "$boot_version" == "$baseline_boot" ]]; then
            skip='true'
          fi

          baseline_minor="${baseline_ai%.*}"
          target_minor="${ai_version%.*}"
          test_filter=''
          if [[ "$target_minor" != "$baseline_minor" ]]; then
            # Exclude only the intentional minor-line reminder test so real compatibility breaks stand out.
            test_filter='-Dtest=!OpenRouterRetrySettingsTests#errorHandlerConsumersWereCheckedForThisSpringAiLine'
          fi

          {
            echo "spring_ai=${ai_version}"
            echo "spring_boot=${boot_version}"
            echo "test_filter=${test_filter}"
            echo "skip=${skip}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Spring Compatibility Canary"
            echo "- Baseline in \`pom.xml\`: Spring AI \`${baseline_ai}\` + Spring Boot \`${baseline_boot}\`"
            echo "- Resolved pair: Spring AI \`${ai_version}\` + Spring Boot \`${boot_version}\`"
            if [[ "$skip" == 'true' ]]; then
              echo "- Skipped scheduled run: resolved pair matches the current baseline already covered by CI."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Maven build against resolved Spring pair
        if: steps.resolve.outputs.skip != 'true'
        env:
          SPRING_AI: ${{ steps.resolve.outputs.spring_ai }}
          SPRING_BOOT: ${{ steps.resolve.outputs.spring_boot }}
          TEST_FILTER: ${{ steps.resolve.outputs.test_filter }}
        run: |
          set -euo pipefail
          args=(-B -ntp "-Dspring-ai.version=${SPRING_AI}" "-Dspring-boot.version=${SPRING_BOOT}")
          if [[ -n "$TEST_FILTER" ]]; then
            args+=("$TEST_FILTER")
          fi
          mvn "${args[@]}" verify
