name: Build, Test, and Compatibility

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"

permissions:
  contents: read

jobs:
  action-pins:
    name: Immutable action references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install policy parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test and enforce action pins
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/check_action_pins.py

  native-smoke:
    name: Native JSON and SSE smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: graalvm
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.7.1
      - name: Verify synthetic fixtures on the JVM
        run: gradle --no-daemon -p native-smoke-tests bootRun
      - name: Compile native consumer
        run: gradle --no-daemon -p native-smoke-tests nativeCompile
      - name: Execute native JSON and SSE contracts
        run: timeout 120s native-smoke-tests/build/native/nativeCompile/native-smoke

  release-packaging:
    name: Verify release packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.7.1
      - uses: ./.github/actions/check-release
        with:
          version: 0.0.0-RC1

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact

  maven-build:
    name: Package with Maven · Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: gitleaks

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      # A run-scoped key always misses, so every run saves back whatever it had to download.
      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: maven-package-java${{ matrix.java-version }}-${{ github.run_id }}
          restore-keys: maven-package-java${{ matrix.java-version }}-

      - name: Maven build
        run: mvn -B -DskipTests package

      - name: Check POM and properties formatting
        run: mvn -B -Pspotless spotless:check

  gradle-build:
    name: Assemble with Gradle · Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: gitleaks

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.7.1

      - name: Gradle build
        run: gradle --no-daemon assemble

      - name: Check Java style
        if: matrix.java-version != '17'
        run: gradle --no-daemon checkstyleMain checkstyleTest

  maven-test:
    name: Verify with Maven · Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: maven-build

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      # Keyed apart from the package job: verify resolves a wider plugin set than package.
      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: maven-verify-java${{ matrix.java-version }}-${{ github.run_id }}
          restore-keys: maven-verify-java${{ matrix.java-version }}-

      - name: Maven test
        run: mvn -B ${{ matrix.java-version == '25' && '-Pmodernizer-java25' || '' }} verify

  gradle-test:
    name: Verify with Gradle · Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: gradle-build

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.7.1

      - name: Gradle test
        run: gradle --no-daemon check

  garage-pr:
    name: Run pull request compatibility tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs:
      - maven-test
      - gradle-test
    timeout-minutes: 20
    concurrency:
      group: garage-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build Garage without credentials
        run: mvn -B -pl openrouter-spring-ai-samples -am -DskipTests package

      - name: Require the scoped pull request inference key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_FREE_KEY }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "OPENROUTER_CI_FREE_KEY is not configured." >&2
            exit 1
          fi

      - name: Run Garage pull request text checks
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_FREE_KEY }}
        run: |
          jar_path=$(find openrouter-spring-ai-samples/target -maxdepth 1 -type f \
            -name 'openrouter-spring-ai-samples-*.jar' ! -name '*.original' -print -quit)
          test -n "$jar_path"
          java -jar "$jar_path" \
            --text \
            --scene=streaming-dispatch,dyno-tuning,attribution-check-in,recovery-road-test \
            --foreman-model=google/gemini-2.5-flash-lite \
            --specialist-model=google/gemini-2.5-flash-lite \
            --fallback-models= \
            --request-mode=both \
            --max-completion-tokens=256 \
            --specialist-max-completion-tokens=128 \
            --reasoning-effort=low \
            --provider-sort=price \
            --provider-order= \
            --provider-ignore= \
            --provider-quantizations= \
            --output=garage-output

      - name: Add capability report to job summary
        if: always()
        run: |
          report=$(find garage-output -type f -name capability-report.md -print -quit 2>/dev/null || true)
          if [[ -n "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized Garage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garage-pr-${{ github.event.pull_request.number }}
          path: |
            garage-output/**/capability-report.md
            garage-output/**/garage-run.json
            garage-output/**/README.md
          if-no-files-found: ignore
          retention-days: 14
