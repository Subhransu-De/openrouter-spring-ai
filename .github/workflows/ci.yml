name: Build, Test, and Compatibility

on:
  workflow_dispatch:
    inputs:
      mutation-workers:
        description: PIT workers for an isolated mutation run
        type: choice
        options: ['2', '4']
        default: '2'
      mutation-build:
        description: Build tool for the isolated mutation run
        type: choice
        options: [Maven, Gradle]
        default: Maven
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"

permissions:
  contents: read

jobs:
  mutation:
    name: Focused mutation gate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: inputs.mutation-build == 'Gradle'
        with:
          gradle-version: 9.7.1
      - name: Run synthetic core mutation tests
        env:
          PIT_THREADS: ${{ inputs.mutation-workers }}
          PIT_BUILD: ${{ inputs.mutation-build }}
        run: |
          options=()
          if [[ -n "$PIT_THREADS" ]]; then options+=("-Dmutation.threads=$PIT_THREADS"); fi
          command=(mvn -B -pl openrouter-spring-ai -am -Pmutation "${options[@]}" test-compile org.pitest:pitest-maven:mutationCoverage)
          if [[ "$PIT_BUILD" == Gradle ]]; then
            command=(gradle --no-daemon :openrouter-spring-ai:mutation "-Pmutation.threads=$PIT_THREADS")
          fi
          /usr/bin/time -v "${command[@]}" &
          mutation_pid=$!
          peak=0
          while kill -0 "$mutation_pid" 2>/dev/null; do
            rss=$(ps -e -o comm=,rss= | awk '$1 == "java" {sum += $2} END {print sum+0}')
            if (( rss > peak )); then peak=$rss; fi
            sleep 1
          done
          echo "Peak combined JVM RSS: $peak KiB"
          wait "$mutation_pid"
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports
          path: |
            openrouter-spring-ai/target/pit-reports/
            openrouter-spring-ai/build/reports/pitest/
          if-no-files-found: warn
          retention-days: 14

  actionlint:
    if: github.event_name != 'workflow_dispatch'
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          mkdir -p actionlint-bin
          tar -xzf actionlint.tar.gz -C actionlint-bin actionlint
          echo "$PWD/actionlint-bin" >> "$GITHUB_PATH"
          shellcheck --version
      - name: Verify workflow and shell diagnostics
        run: |
          # Synthetic input stays outside .github/workflows and is never executed.
          cat > "$RUNNER_TEMP/invalid-workflow.yml" <<'YAML'
          on: push
          jobs:
            test:
              needs: nonexistent
              runs-on: ubuntu-latest
              steps:
                - run: echo $SYNTHETIC_VALUE
          YAML
          if actionlint -oneline "$RUNNER_TEMP/invalid-workflow.yml" > "$RUNNER_TEMP/diagnostics.txt" 2>&1; then
            echo 'Expected synthetic workflow to fail validation'
            exit 1
          fi
          cat "$RUNNER_TEMP/diagnostics.txt"
          grep -E 'invalid-workflow.yml:3:[0-9]+:.*nonexistent.*\[job-needs\]' "$RUNNER_TEMP/diagnostics.txt"
          grep -E 'invalid-workflow.yml:7:[0-9]+:.*SC2086.*\[shellcheck\]' "$RUNNER_TEMP/diagnostics.txt"
      - name: Check all tracked workflows
        run: git ls-files -z '.github/workflows/*.yml' '.github/workflows/*.yaml' | xargs -0 --no-run-if-empty actionlint -color
      - name: Check shared action scripts
        run: shellcheck .github/actions/*/*.sh
      - name: Verify Garage actions with synthetic fixtures
        run: bash .github/actions/tests/garage.sh

  action-pins:
    if: github.event_name != 'workflow_dispatch'
    name: Immutable action references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install action auditor
        run: python3 -m pip install zizmor==1.30.1
      - name: Enforce action pins
        run: |
          zizmor --offline --no-config --no-ignores --strict-collection --format=json --no-exit-codes . > "$RUNNER_TEMP/action-audit.json"
          jq -e '[.[] | select(.ident == "unpinned-uses")] | if length == 0 then true else ., false end' "$RUNNER_TEMP/action-audit.json"

  nullaway:
    if: github.event_name != 'workflow_dispatch'
    name: NullAway · ${{ matrix.build }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [Maven, Gradle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: matrix.build == 'Gradle'
        with:
          gradle-version: 9.7.1
      - name: Check production null contracts with Maven
        if: matrix.build == 'Maven'
        run: mvn -B -Pnullaway -DskipTests compile
      - name: Check production null contracts with Gradle
        if: matrix.build == 'Gradle'
        run: gradle --no-daemon -Pnullaway compileJava

  spotbugs:
    if: github.event_name != 'workflow_dispatch'
    name: SpotBugs correctness · ${{ matrix.build }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [Maven, Gradle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: matrix.build == 'Gradle'
        with:
          gradle-version: 9.7.1
      - name: Enforce correctness with Maven
        if: matrix.build == 'Maven'
        run: mvn -B -Pcorrectness -pl openrouter-spring-ai-autoconfigure -am -DskipTests verify
      - name: Enforce correctness with Gradle
        if: matrix.build == 'Gradle'
        run: gradle --no-daemon spotbugsCorrectness
      - name: Verify Maven detectors and profile isolation
        if: matrix.build == 'Maven'
        run: python3 config/spotbugs/verify.py maven --command mvn --work-dir "$RUNNER_TEMP/spotbugs-fixtures"
      - name: Verify Gradle detectors and failure handling
        if: matrix.build == 'Gradle'
        run: python3 config/spotbugs/verify.py gradle --command gradle --work-dir "$RUNNER_TEMP/spotbugs-fixtures"
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spotbugs-${{ matrix.build }}
          retention-days: 7
          path: |
            **/target/spotbugs-*.xml
            **/target/spotbugs/*/spotbugs.html
            **/build/reports/spotbugs/*/spotbugs.xml
            **/build/reports/spotbugs/*/spotbugs.html
            ${{ runner.temp }}/spotbugs-fixtures/*.log

  security:
    if: github.event_name != 'workflow_dispatch'
    name: FindSecBugs security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Analyze production library classes
        run: mvn -B -Psecurity -pl openrouter-spring-ai-autoconfigure -am -DskipTests verify

  gitleaks:
    if: github.event_name != 'workflow_dispatch'
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact

  maven-build:
    name: Package with Maven · Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: gitleaks

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      # A run-scoped key always misses, so every run saves back whatever it had to download.
      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-package-java${{ matrix.java-version }}-${{ github.run_id }}
          restore-keys: maven-package-java${{ matrix.java-version }}-

      - name: Maven build
        run: mvn -B -DskipTests package

      - name: Check POM and properties formatting
        run: mvn -B -Pspotless spotless:check

  gradle-build:
    name: Assemble with Gradle · Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: gitleaks

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.7.1

      - name: Gradle build
        run: gradle --no-daemon assemble

      - name: Check Java style
        if: matrix.java-version != '17'
        run: gradle --no-daemon checkstyleMain checkstyleTest

  maven-test:
    name: Verify with Maven · Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: maven-build

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      # Keyed apart from the package job: verify resolves a wider plugin set than package.
      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-verify-java${{ matrix.java-version }}-${{ github.run_id }}
          restore-keys: maven-verify-java${{ matrix.java-version }}-

      - name: Maven test
        run: mvn -B ${{ matrix.java-version == '25' && '-Pmodernizer-java25' || '' }} verify

      - name: Exercise Maven coverage gates with synthetic fixtures
        if: matrix.java-version == '25'
        run: python3 config/coverage/verify.py maven --command mvn --work-dir "$RUNNER_TEMP/coverage-fixtures"

      - name: Exercise Maven PMD gates with synthetic fixtures
        if: matrix.java-version == '25'
        run: python3 config/pmd/verify.py maven --command mvn --work-dir "$RUNNER_TEMP/pmd-fixtures"

      - name: Publish synthetic test and coverage reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-verification-java${{ matrix.java-version }}
          retention-days: 7
          path: |
            **/target/site/jacoco/
            **/target/surefire-reports/
            ${{ runner.temp }}/coverage-fixtures/*.log
            ${{ runner.temp }}/coverage-fixtures/**/target/site/jacoco/
            ${{ runner.temp }}/coverage-fixtures/**/target/surefire-reports/
            ${{ runner.temp }}/pmd-fixtures/*.log
            ${{ runner.temp }}/pmd-fixtures/**/target/pmd*.xml

  gradle-test:
    name: Verify with Gradle · Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: gradle-build

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.7.1

      - name: Gradle test
        run: gradle --no-daemon check

      - name: Exercise Gradle coverage gates with synthetic fixtures
        if: matrix.java-version == '25'
        run: python3 config/coverage/verify.py gradle --command gradle --work-dir "$RUNNER_TEMP/coverage-fixtures"

      - name: Exercise Gradle PMD gates with synthetic fixtures
        if: matrix.java-version == '25'
        run: python3 config/pmd/verify.py gradle --command gradle --work-dir "$RUNNER_TEMP/pmd-fixtures"

      - name: Publish synthetic test and coverage reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-verification-java${{ matrix.java-version }}
          retention-days: 7
          path: |
            **/build/reports/jacoco/test/
            **/build/reports/tests/
            **/build/test-results/
            ${{ runner.temp }}/coverage-fixtures/*.log
            ${{ runner.temp }}/coverage-fixtures/**/build/reports/jacoco/test/
            ${{ runner.temp }}/coverage-fixtures/**/build/reports/tests/
            ${{ runner.temp }}/coverage-fixtures/**/build/test-results/
            ${{ runner.temp }}/pmd-fixtures/*.log
            ${{ runner.temp }}/pmd-fixtures/**/build/reports/pmd/

  garage-pr:
    name: Run pull request compatibility tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs:
      - maven-test
      - gradle-test
    timeout-minutes: 20
    concurrency:
      group: garage-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build Garage without credentials
        run: mvn -B -pl openrouter-spring-ai-samples -am -DskipTests package

      - name: Run Garage pull request text checks
        uses: ./.github/actions/run-garage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_FREE_KEY }}
        with:
          key-name: OPENROUTER_CI_FREE_KEY
          arguments: |
            --text
            --scene=streaming-dispatch,dyno-tuning,attribution-check-in,recovery-road-test
            --foreman-model=google/gemini-2.5-flash-lite
            --specialist-model=google/gemini-2.5-flash-lite
            --fallback-models=
            --request-mode=both
            --max-completion-tokens=256
            --specialist-max-completion-tokens=128
            --reasoning-effort=low
            --provider-sort=price
            --provider-order=
            --provider-ignore=
            --provider-quantizations=
            --output=garage-output

      - name: Publish Garage evidence
        if: always()
        uses: ./.github/actions/garage-evidence
        with:
          artifact-name: garage-pr-${{ github.event.pull_request.number }}
          retention-days: 14
