name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"

permissions:
  contents: read

jobs:
  release-packaging:
    name: Release packaging and consumer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: 9.7.1
      - uses: ./.github/actions/check-release
        with:
          version: 0.0.0-RC1

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact

  maven-build:
    name: Maven build Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: gitleaks

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Maven build
        run: mvn -B -DskipTests package

      - name: Check POM and properties formatting
        run: mvn -B -Pspotless spotless:check

  gradle-build:
    name: Gradle build Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: gitleaks

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: 9.7.1

      - name: Gradle build
        run: gradle --no-daemon assemble

      - name: Check Java style
        if: matrix.java-version != '17'
        run: gradle --no-daemon checkstyleMain checkstyleTest

  maven-test:
    name: Maven test Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: maven-build

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Maven test
        run: mvn -B verify

  gradle-test:
    name: Gradle test Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: gradle-build

    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: 9.7.1

      - name: Gradle test
        run: gradle --no-daemon check

  garage-pr-free:
    name: Garage free live compatibility
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs:
      - maven-test
      - gradle-test
    timeout-minutes: 20
    concurrency:
      group: garage-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build Garage without credentials
        run: mvn -B -pl openrouter-spring-ai-samples -am -DskipTests package

      - name: Require the scoped free-inference key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_FREE_KEY }}
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "OPENROUTER_CI_FREE_KEY is not configured." >&2
            exit 1
          fi

      - name: Run Garage free text checks
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_FREE_KEY }}
        run: |
          jar_path=$(find openrouter-spring-ai-samples/target -maxdepth 1 -type f \
            -name 'openrouter-spring-ai-samples-*.jar' ! -name '*.original' -print -quit)
          test -n "$jar_path"
          java -jar "$jar_path" \
            --text \
            --scene=streaming-dispatch,dyno-tuning,attribution-check-in,recovery-road-test \
            --foreman-model=nex-agi/nex-n2.5-mini:free \
            --specialist-model=nex-agi/nex-n2.5-mini:free \
            --fallback-models= \
            --request-mode=both \
            --max-completion-tokens=256 \
            --specialist-max-completion-tokens=128 \
            --reasoning-effort=low \
            --provider-sort=price \
            --provider-order= \
            --provider-ignore= \
            --provider-quantizations= \
            --max-cost-usd=0 \
            --output=garage-output

      - name: Add capability report to job summary
        if: always()
        run: |
          report=$(find garage-output -type f -name capability-report.md -print -quit 2>/dev/null || true)
          if [[ -n "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized Garage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garage-pr-${{ github.event.pull_request.number }}
          path: |
            garage-output/**/capability-report.md
            garage-output/**/garage-run.json
            garage-output/**/README.md
          if-no-files-found: ignore
          retention-days: 14
