name: Weekly Image Compatibility Tests

on:
  schedule:
    # 00:10 Sunday IST. GitHub schedules use UTC, so this is Saturday evening UTC.
    - cron: "40 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garage-weekly
  cancel-in-progress: false

jobs:
  garage:
    name: Test image generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build Garage without credentials
        run: mvn -B -pl openrouter-spring-ai-samples -am -DskipTests package

      - name: Select this week's image surface
        id: rotation
        shell: bash
        run: |
          week_index=$(($(date -u +%s) / 604800))
          case $((week_index % 3)) in
            0)
              echo "surface=sync" >> "$GITHUB_OUTPUT"
              echo "model=black-forest-labs/flux.2-klein-4b" >> "$GITHUB_OUTPUT"
              echo "quality=" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "surface=streaming" >> "$GITHUB_OUTPUT"
              echo "model=openai/gpt-image-1-mini" >> "$GITHUB_OUTPUT"
              echo "quality=low" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "surface=chat" >> "$GITHUB_OUTPUT"
              echo "model=google/gemini-2.5-flash-image" >> "$GITHUB_OUTPUT"
              echo "quality=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run one Garage image-generation probe
        uses: ./.github/actions/run-garage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_CI_WEEKLY_KEY }}
        with:
          key-name: OPENROUTER_CI_WEEKLY_KEY
          image-quality: ${{ steps.rotation.outputs.quality }}
          arguments: |
            --image
            --request-mode=chat
            --output=garage-output
            --image-surface=${{ steps.rotation.outputs.surface }}
            --image-model=${{ steps.rotation.outputs.model }}

      - name: Publish Garage evidence
        if: always()
        uses: ./.github/actions/garage-evidence
        with:
          artifact-name: garage-weekly-${{ github.run_id }}
          retention-days: 90
