name: Documentation Formatting

on:
  push:
    branches:
      - "**"
    paths:
      - "README.md"
      - ".prettierrc.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "README.md"
      - ".prettierrc.json"
      - ".github/workflows/docs.yml"

jobs:
  format:
    name: Check README formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run Prettier check
        run: npx --yes prettier@3.9.6 --check README.md
