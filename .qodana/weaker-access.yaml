baseProfile: empty
name: openrouter.weaker-access

inspections:
  - inspection: WeakerAccess
    enabled: true
    # The supported consumer API listed in the README has callers outside this repository.
    # A single `*` matches one package; `..*` also matches its subpackages.
    ignore:
      - "scope#src:de.subhransu.openrouter.springai.OpenRouterIdentifiers"
      - "scope#src:de.subhransu.openrouter.springai.chat.*"
      - "scope#src:de.subhransu.openrouter.springai.embedding.*"
      - "scope#src:de.subhransu.openrouter.springai.image.*"
      - "scope#src:de.subhransu.openrouter.springai.api.OpenRouterApi"
      - "scope#src:de.subhransu.openrouter.springai.api.OpenRouterRequestMode"
      - "scope#src:de.subhransu.openrouter.springai.api.dto..*"
      # Error factories, classifiers, wire responses, messages, and deserializers are implementation details.
      - "scope#src:de.subhransu.openrouter.springai.errors.*&&!src:de.subhransu.openrouter.springai.errors.*Factory&&!src:de.subhransu.openrouter.springai.errors.*Classifier&&!src:de.subhransu.openrouter.springai.errors.OpenRouterErrorResponse&&!src:de.subhransu.openrouter.springai.errors.OpenRouterExceptionMessage&&!src:de.subhransu.openrouter.springai.errors.*Deserializer"
      - "scope#src:de.subhransu.openrouter.springai.chat.errors.*"
      - "scope#src:de.subhransu.openrouter.springai.api.errors.OpenRouterApiException"
      - "scope#src:de.subhransu.openrouter.springai.autoconfigure.*Properties"
