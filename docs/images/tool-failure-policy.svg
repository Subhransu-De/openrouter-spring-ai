<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" role="img" aria-labelledby="title">
<title id="title">Tool failure policy: which processor turns a tool exception into a result, and which custom ToolCallingManager beans start</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="430" rx="14"/>
<!-- panel A -->
<text class="h" x="30" y="42">Which processor handles a tool exception?</text>
<rect class="card" x="30" y="62" width="270" height="50" rx="8"/>
<text class="t" x="44" y="84">App declares its own</text>
<text class="m" x="44" y="102">ChatModel</text><text class="t" x="116" y="102">bean?</text>
<path class="arr" marker-end="url(#a)" d="M300 87 H326"/>
<text class="s" x="313" y="80" text-anchor="middle">yes</text>
<rect class="spr" x="330" y="62" width="150" height="50" rx="8"/>
<text class="t" x="344" y="84">You own the policy</text>
<text class="s" x="344" y="102">starter adds nothing</text>

<path class="arr" marker-end="url(#a)" d="M155 112 V138"/>
<text class="s" x="163" y="130">no</text>
<rect class="card" x="30" y="142" width="270" height="50" rx="8"/>
<text class="t" x="44" y="164">App declares a bean of type</text>
<text class="m" x="44" y="182">ToolExecutionExceptionProcessor?</text>
<path class="arr" marker-end="url(#a)" d="M300 167 H326"/>
<text class="s" x="313" y="160" text-anchor="middle">yes</text>
<rect class="spr" x="330" y="142" width="150" height="50" rx="8"/>
<text class="t" x="344" y="164">Your processor</text>
<text class="s" x="344" y="182">takes precedence</text>

<path class="arr" marker-end="url(#a)" d="M155 192 V218"/>
<text class="s" x="163" y="210">no</text>
<rect class="card" x="30" y="222" width="270" height="50" rx="8"/>
<text class="m" x="44" y="243">spring.ai.tools.throw-</text>
<text class="m" x="44" y="261">exception-on-error=true?</text>
<path class="arr" marker-end="url(#a)" d="M300 247 H326"/>
<text class="s" x="313" y="240" text-anchor="middle">yes</text>
<rect class="warn" x="330" y="222" width="150" height="50" rx="8"/>
<text class="t" x="344" y="244">Spring AI throws</text>
<text class="s" x="344" y="262">its default policy</text>

<path class="arr g" marker-end="url(#ag)" d="M155 272 V298"/>
<text class="s" x="163" y="290">no</text>
<rect class="lib" x="30" y="302" width="450" height="56" rx="8"/>
<text class="mb" x="46" y="326">OpenRouterToolExecutionExceptionProcessor</text>
<text class="s" x="46" y="346">supplied by the starter: returns a stable, sanitized error result</text>

<!-- divider -->
<line class="rule" x1="505" y1="30" x2="505" y2="410"/>

<!-- panel B -->
<text class="h" x="530" y="42">Does a custom <tspan class="mb">ToolCallingManager</tspan> bean start?</text>
<line class="arr" x1="545" y1="54" x2="545" y2="221"/>
<path class="arr g" marker-end="url(#ag)" d="M545 89 H566"/>
<rect class="lib" x="570" y="62" width="400" height="54" rx="8"/>
<text class="m" x="584" y="84">OpenRouterToolCallingManagers</text>
<text class="m" x="584" y="104">  .withFailurePolicy(processor, …)</text>
<text class="s tl" x="956" y="84" text-anchor="end" font-weight="650">✓ starts</text>

<path class="arr g" marker-end="url(#ag)" d="M545 155 H566"/>
<rect class="lib" x="570" y="128" width="400" height="54" rx="8"/>
<text class="m" x="584" y="150">implements OpenRouterToolFailurePolicy</text>
<text class="s" x="584" y="170">returns the processor it really uses</text>
<text class="s tl" x="956" y="150" text-anchor="end" font-weight="650">✓ starts</text>

<path class="arr r" marker-end="url(#ar)" d="M545 221 H566"/>
<rect class="bad" x="570" y="194" width="400" height="54" rx="8"/>
<text class="m" x="584" y="216">ToolCallingManager.builder().build()</text>
<text class="s" x="584" y="236">policy not visible to the starter</text>
<text class="s tb" x="956" y="216" text-anchor="end" font-weight="650">✗ startup fails</text>

<path class="arr" marker-end="url(#a)" d="M770 248 V266"/>
<text class="s" x="780" y="262">unless</text>
<rect class="warn" x="570" y="270" width="400" height="54" rx="8"/>
<text class="m" x="584" y="292">…chat.allow-unsafe-tool-failure-results=true</text>
<text class="s" x="584" y="312">skips the check; redacting failures is your job</text>

<rect class="card" x="530" y="344" width="450" height="56" rx="8"/>
<text class="s" x="546" y="367">The processor must be an application bean or an</text>
<text class="s" x="546" y="386"><tspan class="m" style="fill:var(--ink)">OpenRouterToolExecutionExceptionProcessor</tspan>; inline instances fail.</text>
<text class="s" x="30" y="392">The starter's processor and manager check apply only when</text>
<text class="s" x="30" y="410">chat uses OpenRouter and no <tspan class="m" style="fill:var(--ink)">ChatModel</tspan> bean is declared.</text>
</svg>
