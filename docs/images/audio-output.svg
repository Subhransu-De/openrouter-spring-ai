<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" role="img" aria-labelledby="title">
<title id="title">Streamed chat audio: decoded chunks are appended per choice and emitted once as one Media, on a stop finish reason or after DONE</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="420" rx="14"/>
<text class="s" x="40" y="44">streamed Chat Completions deltas, one choice</text>
<rect class="card" x="40" y="58" width="96" height="30" rx="6"/><text class="m" x="88" y="77.5" text-anchor="middle">audio.data</text>
<rect class="card" x="150" y="58" width="96" height="30" rx="6"/><text class="m" x="198" y="77.5" text-anchor="middle">audio.data</text>
<rect class="card" x="260" y="58" width="96" height="30" rx="6"/><text class="m" x="308" y="77.5" text-anchor="middle">audio.data</text>
<path class="arr" marker-end="url(#a)" d="M88 88 V126"/>
<path class="arr" marker-end="url(#a)" d="M198 88 V126"/>
<path class="arr" marker-end="url(#a)" d="M308 88 V126"/>
<text class="s" x="94" y="112">decode base64</text>
<rect class="lib" x="40" y="130" width="320" height="30" rx="6"/>
<line x1="147" y1="130" x2="147" y2="160" style="stroke:var(--libs);stroke-width:1"/>
<line x1="254" y1="130" x2="254" y2="160" style="stroke:var(--libs);stroke-width:1"/>
<text class="s" x="200" y="182" text-anchor="middle">bytes appended per choice; no partial media</text>
<!-- branch -->
<path class="arr g" marker-end="url(#ag)" d="M360 145 H385 V100 H416"/>
<path class="arr g" marker-end="url(#ag)" d="M385 145 V220 H416"/>
<!-- path A -->
<text class="s tl" x="420" y="72" font-weight="650">path A</text>
<rect class="card" x="420" y="80" width="170" height="40" rx="8"/>
<text class="m" x="505" y="104.5" text-anchor="middle">finish_reason: stop</text>
<path class="arr g" marker-end="url(#ag)" d="M590 100 H726"/>
<rect class="lib" x="730" y="76" width="250" height="48" rx="8"/>
<text class="h" x="855" y="97" text-anchor="middle">one complete Media</text>
<text class="s" x="855" y="114" text-anchor="middle">in that same response</text>
<!-- path B -->
<text class="s tl" x="420" y="186" font-weight="650">path B</text>
<rect class="card" x="420" y="194" width="170" height="52" rx="8"/>
<text class="m" x="505" y="216" text-anchor="middle">expires_at only</text>
<text class="s" x="505" y="234" text-anchor="middle">no finish reason</text>
<path class="arr" marker-end="url(#a)" d="M590 220 H606"/>
<rect class="card" x="610" y="200" width="84" height="40" rx="8"/>
<text class="m" x="652" y="224.5" text-anchor="middle">[DONE]</text>
<path class="arr g" marker-end="url(#ag)" d="M694 220 H726"/>
<rect class="lib" x="730" y="187" width="250" height="66" rx="8"/>
<text class="h" x="855" y="208" text-anchor="middle">one complete Media</text>
<text class="s" x="855" y="226" text-anchor="middle">in one extra response after [DONE]</text>
<text class="s" x="855" y="243" text-anchor="middle">empty text · no usage · no finish reason</text>
<text class="s" x="420" y="272">Some providers, including OpenAI audio models, end this way.</text>
<text class="s tw" x="420" y="289">A max_tokens cut-off looks the same, so leave enough room.</text>
<line class="rule" x1="20" y1="306" x2="980" y2="306"/>
<text class="t" x="40" y="334"><tspan font-weight="650">Transcript</tspan> goes once into the final assistant metadata as <tspan class="m">openrouter.audio</tspan>, not into the text.</text>
<text class="s" x="40" y="356">A later transport or provider error still fails the stream. Wait for completion before treating the request as successful.</text>
<text class="s tb" x="40" y="392" font-weight="650">rejected</text>
<rect class="bad" x="112" y="375" width="190" height="26" rx="6"/><text class="s" x="207" y="392" text-anchor="middle" style="fill:var(--ink)"><tspan class="m">call()</tspan>: no blocking adapter</text>
<rect class="bad" x="312" y="375" width="130" height="26" rx="6"/><text class="s" x="377" y="392" text-anchor="middle" style="fill:var(--ink)">Responses mode</text>
</svg>
