<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" role="img" aria-labelledby="title">
<title id="title">Chat Completions and Responses compared: wire fields, rejected options and stream endings</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="600" rx="14"/>
<defs>
<symbol id="ok" viewBox="-9 -9 18 18"><circle r="8" class="lib"/><path d="M-4 0.4 L-1.3 3.2 L4 -2.9" style="fill:none;stroke:var(--libs);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/></symbol>
<symbol id="no" viewBox="-9 -9 18 18"><circle r="8" class="bad"/><path d="M-3 -3 L3 3 M3 -3 L-3 3" style="fill:none;stroke:var(--bads);stroke-width:1.8;stroke-linecap:round"/></symbol>
</defs>
<rect class="lib" x="255" y="104" width="355" height="484" rx="8" opacity="0.35" style="stroke:none"/>
<rect class="warn" x="625" y="104" width="355" height="484" rx="8" opacity="0.35" style="stroke:none"/>
<rect class="lib" x="255" y="20" width="355" height="76" rx="8"/>
<text x="271" y="46"><tspan class="h">Chat Completions</tspan><tspan class="s tl" dx="10" font-weight="650">default</tspan></text>
<text class="m" x="271" y="66">POST /chat/completions</text>
<text class="m tm" x="271" y="84">request-mode: openai-chat-completions</text>
<rect class="warn" x="625" y="20" width="355" height="76" rx="8"/>
<text x="641" y="46"><tspan class="h">Responses</tspan><tspan class="s tw" dx="10" font-weight="650">experimental, opt in</tspan></text>
<text class="m" x="641" y="66">POST /responses</text>
<text class="m tm" x="641" y="84">request-mode: openai-responses</text>
<text class="t" x="20" y="139">Structured output</text>
<text class="m" x="271" y="139">response_format</text>
<text class="m" x="641" y="139">text.format</text>
<line class="rule" x1="20" y1="156" x2="980" y2="156"/>
<text class="t" x="20" y="183">Strict function tools</text>
<text class="m" x="271" y="183">tools[].function.strict</text>
<text class="m" x="641" y="183">tools[].strict</text>
<line class="rule" x1="20" y1="200" x2="980" y2="200"/>
<text class="t" x="20" y="231">Token limit</text>
<text class="m" x="271" y="222">maxTokens → max_tokens</text>
<text class="m" x="271" y="240">maxCompletionTokens → max_completion_tokens</text>
<text class="m" x="641" y="222">max_output_tokens</text>
<text class="s" x="641" y="240">maxCompletionTokens wins over maxTokens</text>
<line class="rule" x1="20" y1="252" x2="980" y2="252"/>
<text class="t" x="20" y="283">Usage</text>
<text class="t" x="271" y="274">opt in with</text>
<text class="m" x="271" y="292">includeUsage</text>
<use href="#ok" x="637" y="269" width="18" height="18"/>
<text class="t" x="665" y="274">read from every response</text>
<text class="s" x="665" y="292">includeUsage is rejected</text>
<line class="rule" x1="20" y1="304" x2="980" y2="304"/>
<text class="m" x="20" y="326">stopSequences, seed,</text>
<text class="m" x="20" y="344">repetitionPenalty, minP, topA</text>
<use href="#ok" x="267" y="321" width="18" height="18"/>
<text class="t" x="295" y="335">sent</text>
<use href="#no" x="637" y="321" width="18" height="18"/>
<text class="t" x="665" y="335">rejected before sending</text>
<line class="rule" x1="20" y1="356" x2="980" y2="356"/>
<text class="s" x="20" y="376">extraBody keys</text>
<text class="m" x="20" y="394">logit_bias, logprobs,</text>
<text class="m" x="20" y="412">verbosity, transforms</text>
<use href="#ok" x="267" y="380" width="18" height="18"/>
<text class="t" x="295" y="394">accepted</text>
<use href="#no" x="637" y="380" width="18" height="18"/>
<text class="t" x="665" y="394">rejected</text>
<line class="rule" x1="20" y1="422" x2="980" y2="422"/>
<text class="t" x="20" y="449">Cache breakpoints</text>
<use href="#ok" x="267" y="435" width="18" height="18"/>
<text class="t" x="295" y="449">system and user text</text>
<use href="#no" x="637" y="435" width="18" height="18"/>
<text class="t" x="665" y="449">rejected</text>
<line class="rule" x1="20" y1="466" x2="980" y2="466"/>
<text class="t" x="20" y="493">Chat audio output</text>
<use href="#ok" x="267" y="479" width="18" height="18"/>
<text class="t" x="295" y="493">streaming only</text>
<use href="#no" x="637" y="479" width="18" height="18"/>
<text class="t" x="665" y="493">rejected</text>
<line class="rule" x1="20" y1="510" x2="980" y2="510"/>
<text class="t" x="20" y="550">A stream ends at</text>
<text class="m" x="271" y="550">[DONE]</text>
<text class="m" x="641" y="532">response.completed / .incomplete / .failed</text>
<text class="s tb" x="641" y="550">[DONE] or EOF alone raises</text>
<text class="m tb" x="641" y="568">OpenRouterTruncatedResponseException</text>
</svg>
