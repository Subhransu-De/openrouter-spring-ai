<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" role="img" aria-labelledby="title">
<title id="title">Reasoning replay: keep the assistant message and its reasoning metadata unchanged in history; edited content with old reasoning is rejected</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="450" rx="14"/>
<!-- A: assistant message -->
<text class="s" x="30" y="42">turn 1 response</text>
<rect class="lib" x="30" y="54" width="310" height="200" rx="10"/>
<text class="mb" x="46" y="80">AssistantMessage</text>
<text class="s" x="46" y="100">text · tool calls · refusal</text>
<line class="rule" x1="46" y1="112" x2="324" y2="112" style="stroke:var(--libs)"/>
<text class="s tl" x="46" y="132" font-weight="650">Chat Completions metadata</text>
<text class="m" x="46" y="151">openrouter.reasoning</text>
<text class="m" x="46" y="169">openrouter.reasoning_details</text>
<text class="s tl" x="46" y="198" font-weight="650">Responses metadata</text>
<text class="m" x="46" y="217">openrouter.responses.reasoning_items</text>
<text class="m" x="46" y="235">openrouter.responses.output_items</text>
<!-- B: history -->
<text class="s" x="390" y="42">your conversation history</text>
<rect class="card" x="390" y="54" width="250" height="200" rx="10"/>
<rect class="spr" x="406" y="70" width="218" height="30" rx="6"/><text class="t" x="420" y="90">user message</text>
<rect class="lib" x="406" y="110" width="218" height="46" rx="6" style="stroke-width:2"/>
<text class="t" x="420" y="130">assistant message</text>
<text class="s tl" x="420" y="148">+ metadata, unchanged</text>
<rect class="spr" x="406" y="166" width="218" height="30" rx="6"/><text class="t" x="420" y="186">tool result</text>
<rect class="spr" x="406" y="206" width="218" height="30" rx="6"/><text class="t" x="420" y="226">next user message</text>
<path class="arr g" marker-end="url(#ag)" d="M340 133 H402"/>
<text class="s" x="371" y="125" text-anchor="middle">keep</text>
<!-- C: next request -->
<rect class="ext" x="700" y="84" width="270" height="140" rx="10"/>
<text class="h" x="716" y="112">Next request</text>
<text class="s" x="716" y="132">also each tool round</text>
<text class="t" x="716" y="164">Reasoning is replayed</text>
<text class="t" x="716" y="184">in its original order, next to</text>
<text class="t" x="716" y="204">text and function calls</text>
<path class="arr x" marker-end="url(#ax)" d="M640 154 H696"/>
<text class="s" x="668" y="146" text-anchor="middle">send</text>
<!-- branches -->
<path class="arr r" marker-end="url(#ar)" d="M470 254 V280 H250 V306"/>
<text class="s tb" x="360" y="274" text-anchor="middle">edit content</text>
<path class="arr g" marker-end="url(#ag)" d="M560 254 V280 H750 V306"/>
<text class="s tl" x="655" y="274" text-anchor="middle">redact</text>
<rect class="bad" x="30" y="310" width="440" height="84" rx="10"/>
<text class="t" x="46" y="336" font-weight="650">Edit text, tool calls or refusal, keep reasoning</text>
<text class="s" x="46" y="356">✗ Responses mode rejects it before sending</text>
<text class="s" x="46" y="376">also reasoning kept without its output snapshot</text>
<rect class="lib" x="530" y="310" width="440" height="84" rx="10"/>
<text class="t" x="546" y="336" font-weight="650">Start a new conversation</text>
<text class="s" x="546" y="356">with the edited messages and no old reasoning</text>
<text class="s" x="546" y="376">or output snapshots: they may hold the original content</text>
<text class="s" x="30" y="428">Custom history stores must keep both metadata fields. Streaming metadata holds cumulative snapshots per choice.</text>
</svg>
