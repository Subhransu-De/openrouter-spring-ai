<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" role="img" aria-labelledby="title">
<title id="title">How a call flows from your application through Spring AI and this library to OpenRouter, and which module holds each part</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="452" rx="14"/>
<!-- column captions -->
<text class="s" x="80" y="50" text-anchor="middle">application</text>
<text class="s" x="247" y="50" text-anchor="middle">Spring AI</text>
<text class="s tl" x="535" y="50" text-anchor="middle" font-weight="650">this library</text>
<text class="s tx" x="867" y="50" text-anchor="middle" font-weight="650">OpenRouter</text>
<line class="rule" x1="355" y1="58" x2="715" y2="58" style="stroke:var(--libs)"/>
<line class="rule" x1="750" y1="58" x2="985" y2="58" style="stroke:var(--exts)"/>
<!-- row 1 -->
<rect class="spr" x="20" y="76" width="120" height="88" rx="8"/>
<text class="h" x="80" y="112" text-anchor="middle">Your app</text>
<text class="m" x="80" y="134" text-anchor="middle">prompt()</text>
<text class="s" x="80" y="150" text-anchor="middle">call or stream</text>

<rect class="spr" x="170" y="76" width="155" height="88" rx="8"/>
<text class="h" x="247" y="106" text-anchor="middle">ChatClient</text>
<text class="s" x="247" y="128" text-anchor="middle">ToolCallingAdvisor</text>
<text class="s" x="247" y="146" text-anchor="middle">runs your tools</text>

<rect class="lib" x="355" y="76" width="190" height="88" rx="8"/>
<text class="mb" x="450" y="106" text-anchor="middle">OpenRouterChatModel</text>
<text class="s" x="450" y="128" text-anchor="middle">options and mappers</text>
<text class="s" x="450" y="146" text-anchor="middle">Spring AI ↔ wire JSON</text>

<rect class="lib" x="575" y="76" width="140" height="88" rx="8"/>
<text class="mb" x="645" y="106" text-anchor="middle">OpenRouterApi</text>
<text class="s" x="645" y="128" text-anchor="middle">RestClient: calls</text>
<text class="s" x="645" y="146" text-anchor="middle">WebClient: SSE</text>

<rect class="ext" x="750" y="76" width="115" height="88" rx="8"/>
<text class="h" x="807" y="108" text-anchor="middle">OpenRouter</text>
<text class="m" x="807" y="130" text-anchor="middle">/api/v1</text>
<text class="s" x="807" y="148" text-anchor="middle">routes, falls back</text>

<rect class="ext" x="895" y="76" width="90" height="24" rx="6"/><text class="s" x="940" y="92.5" text-anchor="middle" style="fill:var(--ink)">Anthropic</text>
<rect class="ext" x="895" y="108" width="90" height="24" rx="6"/><text class="s" x="940" y="124.5" text-anchor="middle" style="fill:var(--ink)">OpenAI</text>
<rect class="ext" x="895" y="140" width="90" height="24" rx="6"/><text class="s" x="940" y="156.5" text-anchor="middle" style="fill:var(--ink)">Google, …</text>
<text class="s" x="940" y="184" text-anchor="middle">upstream providers</text>

<path class="arr" marker-end="url(#a)" d="M140 120 H166"/>
<path class="arr" marker-end="url(#a)" d="M325 120 H351"/>
<path class="arr g" marker-end="url(#ag)" d="M545 120 H571"/>
<path class="arr x" marker-end="url(#ax)" d="M715 120 H746"/>
<path class="arr x" marker-end="url(#ax)" d="M865 120 C878 120 880 88 891 88"/>
<path class="arr x" marker-end="url(#ax)" d="M865 120 H891"/>
<path class="arr x" marker-end="url(#ax)" d="M865 120 C878 120 880 152 891 152"/>

<!-- row 2: other models -->
<text class="s" x="345" y="216" text-anchor="end">also</text>
<rect class="lib" x="355" y="198" width="190" height="28" rx="6"/>
<text class="m" x="450" y="216.5" text-anchor="middle">OpenRouterEmbeddingModel</text>
<rect class="lib" x="355" y="234" width="190" height="28" rx="6"/>
<text class="m" x="450" y="252.5" text-anchor="middle">OpenRouterImageModel</text>
<path class="arr g" d="M545 248 H645"/>
<path class="arr g" marker-end="url(#ag)" d="M545 212 H645 V168"/>

<!-- module ruler -->
<text class="s" x="20" y="306">modules</text>
<line class="rule" x1="80" y1="302" x2="985" y2="302"/>
<rect class="lib" x="355" y="318" width="360" height="30" rx="6"/>
<text x="367" y="338"><tspan class="mb">openrouter-spring-ai</tspan><tspan class="s" dx="8">models, options, API client</tspan></text>
<rect class="card" x="355" y="356" width="360" height="30" rx="6" style="stroke:var(--libs)"/>
<text x="367" y="376"><tspan class="mb">…-autoconfigure</tspan><tspan class="s" dx="8">beans from spring.ai.openrouter.*</tspan></text>
<rect class="card" x="170" y="394" width="545" height="30" rx="6" style="stroke:var(--libs);stroke-width:2"/>
<text x="182" y="414"><tspan class="mb">openrouter-spring-ai-starter</tspan><tspan class="s" dx="8">the one dependency you add; brings ChatClient too</tspan></text>
<text class="s" x="985" y="414" text-anchor="end">Garage demo app: …-samples</text>
</svg>
