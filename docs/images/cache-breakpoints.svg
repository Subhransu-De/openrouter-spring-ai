<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" role="img" aria-labelledby="title">
<title id="title">Prompt-cache breakpoints: an endIndex splits a system or user message into a cached content block and the rest</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="470" rx="14"/>
<!-- message -->
<text class="s" x="30" y="40">UserMessage text</text>
<text x="970" y="40" text-anchor="end"><tspan class="s">metadata</tspan><tspan class="m" dx="8">List.of(new OpenRouterCacheBreakpoint(reference.length()))</tspan></text>
<rect class="lib" x="30" y="66" width="480" height="40" rx="6"/>
<text class="m" x="46" y="91">"Reference material to reuse.\n"</text>
<rect class="card" x="510" y="66" width="460" height="40" rx="6"/>
<text class="m" x="526" y="91">"Answer this turn's question."</text>
<line x1="510" y1="58" x2="510" y2="116" style="stroke:var(--libs);stroke-width:3"/>
<text class="s" x="30" y="128">0</text>
<text class="mb tl" x="516" y="130">endIndex = 29</text>
<text class="s" x="622" y="130">exclusive, in String.length() units</text>
<!-- arrows down -->
<path class="arr g" marker-end="url(#ag)" d="M270 140 V172"/>
<path class="arr" marker-end="url(#a)" d="M740 140 V172"/>
<text class="s" x="282" y="161">Chat Completions request</text>
<!-- wire blocks -->
<text class="m tm" x="30" y="168">content: [</text>
<rect class="lib" x="30" y="176" width="470" height="64" rx="8"/>
<text class="m" x="46" y="201">{"type":"text","text":"Reference…",</text>
<text class="mb tl" x="46" y="223"> "cache_control":{"type":"ephemeral"}}</text>
<rect class="card" x="520" y="176" width="450" height="64" rx="8"/>
<text class="m" x="536" y="212">{"type":"text","text":"Answer…"}</text>
<!-- ttl -->
<text class="s" x="30" y="280" font-weight="650" style="fill:var(--ink)">Lifetime</text>
<rect class="card" x="30" y="290" width="460" height="34" rx="6"/>
<text x="46" y="312"><tspan class="m">Ttl.FIVE_MINUTES</tspan><tspan class="s" dx="6">default</tspan><tspan class="m" dx="12">{"type":"ephemeral"}</tspan></text>
<rect class="card" x="510" y="290" width="460" height="34" rx="6"/>
<text x="526" y="312"><tspan class="m">Ttl.ONE_HOUR</tspan><tspan class="m" dx="12">{"type":"ephemeral","ttl":"1h"}</tspan></text>
<!-- rules -->
<text class="s" x="30" y="362" font-weight="650" style="fill:var(--ink)">Rules, checked before sending</text>
<rect class="lib" x="30" y="372" width="180" height="34" rx="6"/><text class="t" x="120" y="394" text-anchor="middle">at most 4 per request</text>
<rect class="lib" x="220" y="372" width="230" height="34" rx="6"/><text class="t" x="335" y="394" text-anchor="middle">1-hour before 5-minute</text>
<rect class="lib" x="460" y="372" width="200" height="34" rx="6"/><text class="t" x="560" y="394" text-anchor="middle">system and user text</text>
<rect class="lib" x="670" y="372" width="300" height="34" rx="6"/><text class="t" x="820" y="394" text-anchor="middle">offsets increase, no split surrogates</text>
<rect class="bad" x="30" y="414" width="460" height="34" rx="6"/><text class="t" x="260" y="436" text-anchor="middle">✗ assistant, tool result, tool definition, image</text>
<rect class="bad" x="510" y="414" width="460" height="34" rx="6"/><text class="t" x="740" y="436" text-anchor="middle">✗ Responses mode rejects this metadata</text>
</svg>
