<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 504" width="1000" role="img" aria-labelledby="title">
<title id="title">Raw ChatModel calls replace the default options; ChatClient layers them, and null inherits</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="504" rx="14"/>
<!-- lane A: raw model -->
<text x="20" y="46"><tspan class="mb">ChatModel.call(new Prompt(text, options))</tspan><tspan class="s" dx="12">raw model: prompt options replace the defaults</tspan></text>
<text class="s" x="265" y="80" text-anchor="middle">model defaults</text>
<text class="s" x="635" y="80" text-anchor="middle">prompt options</text>
<text class="s" x="862" y="80" text-anchor="middle">sent</text>
<path class="arr g" marker-end="url(#ag)" d="M722 76 H741"/>
<text class="m" x="20" y="113">model</text>
<text class="m" x="20" y="147">seed</text>
<text class="m" x="20" y="181">requestMode</text>
<g opacity="0.5">
<rect class="card" x="180" y="94" width="170" height="28" rx="6"/><text class="m" x="192" y="113">your-model</text>
<rect class="card" x="180" y="128" width="170" height="28" rx="6"/><text class="m" x="192" y="147">7</text>
<rect class="card" x="180" y="162" width="170" height="28" rx="6"/><text class="m" x="192" y="181">OPENAI_RESPONSES</text>
</g>
<text class="s tb" x="450" y="138" text-anchor="middle">not used when</text>
<text class="s tb" x="450" y="155" text-anchor="middle">options are given</text>
<rect class="card" x="550" y="94" width="170" height="28" rx="6"/><text class="m" x="562" y="113">other-model</text>
<rect class="card" x="550" y="128" width="170" height="28" rx="6"/><text class="m tm" x="562" y="147">—</text>
<rect class="card" x="550" y="162" width="170" height="28" rx="6"/><text class="m tm" x="562" y="181">—</text>
<rect class="lib" x="745" y="94" width="235" height="28" rx="6"/><text class="m" x="757" y="113">other-model</text>
<rect class="card" x="745" y="128" width="235" height="28" rx="6"/><text class="m tm" x="757" y="147">—</text>
<rect class="warn" x="745" y="162" width="235" height="28" rx="6"/><text class="m" x="757" y="181">OPENAI_CHAT_COMPLETIONS</text>
<text class="s" x="20" y="212">No prompt options? The defaults apply.</text>
<text class="s tw" x="980" y="212" text-anchor="end">portable ChatOptions carry no mode</text>

<line class="rule" x1="20" y1="232" x2="980" y2="232"/>

<!-- lane B: ChatClient -->
<text x="20" y="266"><tspan class="mb">ChatClient</tspan><tspan class="s" dx="12">layers options: a value overrides, null inherits, stop and tool lists append</tspan></text>
<text class="s" x="265" y="298" text-anchor="middle">model defaults</text>
<text class="m" x="450" y="298" text-anchor="middle">.defaultOptions(…)</text>
<text class="m" x="635" y="298" text-anchor="middle">.options(…)</text>
<text class="s" x="862" y="298" text-anchor="middle">effective request</text>
<path class="arr" marker-end="url(#a)" d="M352 294 H371"/>
<path class="arr" marker-end="url(#a)" d="M527 294 H546"/>
<path class="arr g" marker-end="url(#ag)" d="M722 294 H741"/>
<text class="m" x="20" y="330">requestMode</text>
<text class="m" x="20" y="366">seed</text>
<text class="m" x="20" y="402">stop</text>

<rect class="card" x="180" y="310" width="170" height="30" rx="6"/><text class="m tm" x="192" y="330">unset</text>
<rect class="card" x="180" y="346" width="170" height="30" rx="6"/><text class="m" x="192" y="366">7</text>
<rect class="card" x="180" y="382" width="170" height="30" rx="6"/><text class="m" x="192" y="402">["END"]</text>

<rect class="card" x="375" y="310" width="150" height="30" rx="6"/><text class="m tm" x="387" y="330">—</text>
<rect class="card" x="375" y="346" width="150" height="30" rx="6"/><text class="m tm" x="387" y="366">—</text>
<rect class="card" x="375" y="382" width="150" height="30" rx="6"/><text class="m tm" x="387" y="402">—</text>

<rect class="card" x="550" y="310" width="170" height="30" rx="6"/><text class="m" x="562" y="330">OPENAI_RESPONSES</text>
<rect class="card" x="550" y="346" width="170" height="30" rx="6"/><text class="m" x="562" y="366">null</text>
<rect class="card" x="550" y="382" width="170" height="30" rx="6"/><text class="m" x="562" y="402">["STOP"]</text>

<rect class="lib" x="745" y="310" width="235" height="30" rx="6"/><text class="m" x="757" y="330">OPENAI_RESPONSES</text><text class="s tl" x="970" y="330" text-anchor="end">override</text>
<rect class="warn" x="745" y="346" width="235" height="30" rx="6"/><text class="m" x="757" y="366">7</text><text class="s tw" x="970" y="366" text-anchor="end">inherited</text>
<rect class="warn" x="745" y="382" width="235" height="30" rx="6"/><text class="m" x="757" y="402">["END","STOP"]</text><text class="s tw" x="970" y="402" text-anchor="end">appended</text>

<path class="arr r" marker-end="url(#ar)" d="M862 412 V428"/>
<rect class="bad" x="745" y="432" width="235" height="54" rx="8"/>
<text class="h" x="862" y="455" text-anchor="middle">Rejected before HTTP</text>
<text class="m" x="862" y="475" text-anchor="middle">IllegalArgumentException</text>
<rect class="card" x="20" y="432" width="705" height="54" rx="8"/>
<text class="t" x="36" y="455">Switching modes per request?</text>
<text class="s" x="36" y="474">Leave seed, stop and includeUsage unset in both model and client defaults, or use one client per mode.</text>
</svg>
