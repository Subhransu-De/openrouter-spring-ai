<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 572" width="1000" role="img" aria-labelledby="title">
<title id="title">Tool calling: ChatClient's ToolCallingAdvisor runs the tools; OpenRouterChatModel only advertises them and returns tool calls</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="572" rx="14"/>
<!-- participants -->
<rect class="spr" x="50" y="24" width="120" height="56" rx="8"/>
<text class="h" x="110" y="57" text-anchor="middle">Your app</text>
<rect class="spr" x="265" y="24" width="190" height="56" rx="8"/>
<text class="h" x="360" y="48" text-anchor="middle">ChatClient</text>
<text class="s" x="360" y="68" text-anchor="middle">+ ToolCallingAdvisor</text>
<rect class="lib" x="515" y="24" width="210" height="56" rx="8"/>
<text class="mb" x="620" y="48" text-anchor="middle">OpenRouterChatModel</text>
<text class="s tl" x="620" y="68" text-anchor="middle">never executes tools</text>
<rect class="ext" x="800" y="24" width="140" height="56" rx="8"/>
<text class="h" x="870" y="57" text-anchor="middle">OpenRouter</text>
<!-- lifelines -->
<line class="rule dash" x1="110" y1="80" x2="110" y2="500"/>
<line class="rule dash" x1="620" y1="80" x2="620" y2="500"/>
<line class="rule dash" x1="870" y1="80" x2="870" y2="500"/>
<line class="rule dash" x1="360" y1="80" x2="360" y2="500"/>
<!-- loop frame -->
<rect class="grpx" x="160" y="266" width="800" height="164" rx="10"/>
<rect class="card" x="160" y="266" width="168" height="22" rx="6"/>
<text class="s" x="170" y="281.5">loop while TOOL_CALLS</text>
<!-- advisor activation -->
<rect class="spr" x="353" y="104" width="14" height="390" rx="3"/>
<!-- 1 -->
<text class="s" x="230" y="113" text-anchor="middle">prompt + ToolCallbacks</text>
<path class="arr" marker-end="url(#a)" d="M110 120 H349"/>
<!-- 2 -->
<text class="s" x="492" y="153" text-anchor="middle">prompt + tool definitions</text>
<path class="arr" marker-end="url(#a)" d="M367 160 H616"/>
<!-- 3 -->
<text class="m" x="745" y="188" text-anchor="middle">tools[]</text>
<path class="arr g" marker-end="url(#ag)" d="M620 195 H866"/>
<!-- 4 -->
<text class="m" x="745" y="228" text-anchor="middle">tool_calls</text>
<path class="arr x dash" marker-end="url(#ax)" d="M870 235 H624"/>
<!-- 5 -->
<text class="s" x="492" y="291" text-anchor="middle">tool calls, finish reason <tspan class="mb">TOOL_CALLS</tspan></text>
<path class="arr g dash" marker-end="url(#ag)" d="M620 298 H371"/>
<!-- 6: run tool -->
<rect class="spr" x="180" y="318" width="140" height="40" rx="8"/>
<text class="t" x="250" y="343" text-anchor="middle">your ToolCallback</text>
<path class="arr" marker-end="url(#a)" d="M353 328 H324"/>
<path class="arr dash" marker-end="url(#a)" d="M320 348 H349"/>
<text class="s" x="373" y="345">runs it, appends the result</text>
<!-- 7 -->
<text class="s" x="492" y="383" text-anchor="middle">history + tool results</text>
<path class="arr" marker-end="url(#a)" d="M367 390 H616"/>
<!-- 8 -->
<path class="arr g" marker-end="url(#ag)" d="M620 412 H866"/>
<text class="s" x="745" y="405" text-anchor="middle">request again</text>
<!-- 9 -->
<path class="arr x dash" marker-end="url(#ax)" d="M870 456 H624"/>
<text class="s" x="745" y="449" text-anchor="middle">no more tool calls</text>
<!-- 10 -->
<path class="arr g dash" marker-end="url(#ag)" d="M620 456 H371"/>
<text class="s" x="492" y="449" text-anchor="middle">answer, <tspan class="mb">STOP</tspan></text>
<!-- 11 -->
<path class="arr dash" marker-end="url(#a)" d="M353 486 H114"/>
<text class="s" x="230" y="479" text-anchor="middle">final answer</text>
<!-- opt-out -->
<rect class="warn" x="20" y="516" width="960" height="40" rx="8"/>
<text x="36" y="541"><tspan class="s" style="fill:var(--ink)">Opt out per request:</tspan><tspan class="m" dx="8">advisors(AdvisorParams.toolCallingAdvisorAutoRegister(false))</tspan><tspan class="s" dx="8">returns the tool calls to you without running them.</tspan></text>
</svg>
