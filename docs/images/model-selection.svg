<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" role="img" aria-labelledby="title">
<title id="title">How the starter decides which model bean each modality gets</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="510" rx="14"/>
<!-- selector -->
<rect class="spr" x="20" y="196" width="190" height="84" rx="8"/>
<text class="h" x="115" y="224" text-anchor="middle">Selector</text>
<text class="m" x="115" y="246" text-anchor="middle">spring.ai.model.chat</text>
<text class="s" x="115" y="266" text-anchor="middle">same for .embedding, .image</text>

<path class="arr" marker-end="url(#a)" d="M210 238 H235 V90 H346"/>
<path class="arr" marker-end="url(#a)" d="M210 238 H346"/>
<path class="arr g" marker-end="url(#ag)" d="M235 238 V386 H346"/>
<text class="m" x="245" y="82">none</text>
<text class="m" x="245" y="230">other id</text>
<text class="m tl" x="245" y="378">openrouter</text>
<text class="s" x="245" y="404">default</text>

<rect class="card" x="350" y="60" width="210" height="60" rx="8"/>
<text class="h" x="455" y="86" text-anchor="middle">Modality off</text>
<text class="s" x="455" y="106" text-anchor="middle">no model bean for it</text>

<rect class="spr" x="350" y="208" width="210" height="60" rx="8"/>
<text class="h" x="455" y="234" text-anchor="middle">That provider</text>
<text class="s" x="455" y="254" text-anchor="middle">its auto-configuration runs</text>

<rect class="card" x="350" y="346" width="210" height="80" rx="8" style="stroke-dasharray:5 4"/>
<text class="t" x="455" y="374" text-anchor="middle">Your app declares its own</text>
<text class="mb" x="455" y="394" text-anchor="middle">ChatModel bean?</text>
<text class="s" x="455" y="413" text-anchor="middle">EmbeddingModel, ImageModel</text>

<path class="arr" marker-end="url(#a)" d="M560 386 H600 V338 H646"/>
<path class="arr g" marker-end="url(#ag)" d="M600 386 V446 H646"/>
<text class="s" x="610" y="331">yes</text>
<text class="s tl" x="610" y="439">no</text>

<rect class="spr" x="650" y="300" width="335" height="76" rx="8"/>
<text class="h" x="666" y="326">Starter backs off: your bean is used</text>
<text class="s" x="666" y="346">any bean counts, from any provider</text>
<text class="s tw" x="666" y="364">chat: tool-failure processor and guard also off</text>

<rect class="lib" x="650" y="410" width="335" height="72" rx="8"/>
<text class="h" x="666" y="434">Starter creates the default bean</text>
<text class="mb tl" x="666" y="454">openRouterChatModel</text>
<text class="s" x="666" y="472">openRouterEmbeddingModel, openRouterImageModel</text>

<!-- rules -->
<text class="s" x="650" y="48">always</text>
<line class="rule" x1="700" y1="44" x2="985" y2="44"/>
<rect class="card" x="650" y="60" width="335" height="56" rx="8"/>
<rect x="650" y="60" width="5" height="56" rx="2" style="fill:var(--libs)"/>
<text class="t" x="668" y="83">API key required</text>
<text class="s" x="668" y="102">while any selector is openrouter</text>
<rect class="card" x="650" y="128" width="335" height="56" rx="8"/>
<rect x="650" y="128" width="5" height="56" rx="2" style="fill:var(--libs)"/>
<text class="t" x="668" y="151">Shared OpenRouterApi</text>
<text class="s" x="668" y="170">turns off only when all three selectors are none</text>
<rect class="card" x="650" y="196" width="335" height="56" rx="8"/>
<rect x="650" y="196" width="5" height="56" rx="2" style="fill:var(--libs)"/>
<text class="t" x="668" y="219">Several provider starters?</text>
<text class="s" x="668" y="238">set every selector; bean order must not decide</text>
</svg>
