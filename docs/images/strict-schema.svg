<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" role="img" aria-labelledby="title">
<title id="title">Strict function tools: the schema rules the library checks before sending, what it rejects, and the wire flag per request mode</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="540" rx="14"/>
<text x="30" y="40"><tspan class="m">toolStrict(true)</tspan><tspan class="s" dx="6">or</tspan><tspan class="m" dx="6">spring.ai.openrouter.chat.tool-strict=true</tspan><tspan class="s" dx="10">every function tool; schemas are checked, never rewritten</tspan></text>
<!-- schema card -->
<rect class="card" x="30" y="60" width="470" height="262" rx="10"/>
<rect class="lib" x="58" y="95" width="244" height="46" rx="4" style="stroke:none"/>
<rect class="lib" x="74" y="191" width="301" height="22" rx="4" style="stroke:none"/>
<rect class="lib" x="58" y="239" width="225" height="22" rx="4" style="stroke:none"/>
<text class="m" style="font-size:13px" x="48" y="88">{</text>
<text class="m" style="font-size:13px" x="64" y="112">"type": "object",</text>
<text class="m" style="font-size:13px" x="64" y="136">"additionalProperties": false,</text>
<text class="m" style="font-size:13px" x="64" y="160">"properties": {</text>
<text class="m" style="font-size:13px" x="80" y="184">"part": { "type": "string" },</text>
<text class="m" style="font-size:13px" x="80" y="208">"note": { "type": ["string", "null"] }</text>
<text class="m" style="font-size:13px" x="64" y="232">},</text>
<text class="m" style="font-size:13px" x="64" y="256">"required": ["part", "note"]</text>
<text class="m" style="font-size:13px" x="48" y="280">}</text>
<text class="s" x="48" y="306">An empty object uses empty properties and required.</text>
<!-- callouts -->
<rect class="lib" x="560" y="92" width="410" height="52" rx="8"/>
<text class="t" x="576" y="113">Object root; on every object, nested too:</text>
<text class="m" x="576" y="133">additionalProperties: false</text>
<path class="arr g" marker-end="url(#ag)" d="M560 118 H306"/>

<rect class="lib" x="560" y="174" width="410" height="54" rx="8"/>
<text class="t" x="576" y="196">Optional value: allow null <tspan font-weight="650">and</tspan> keep it required</text>
<text class="m" x="576" y="216">"type": ["string", "null"]</text>
<path class="arr g" marker-end="url(#ag)" d="M560 202 H379"/>

<rect class="lib" x="560" y="236" width="410" height="30" rx="8"/>
<text class="t" x="576" y="256">Lists every property exactly once</text>
<path class="arr g" marker-end="url(#ag)" d="M560 250 H287"/>
<!-- followed -->
<text class="s" x="30" y="352">The check follows nested properties, array items, <tspan class="m" style="fill:var(--ink)">anyOf</tspan>, definitions and local <tspan class="m" style="fill:var(--ink)">$ref</tspan>, recursion included.</text>
<!-- rejected strip -->
<text class="s tb" x="30" y="386" font-weight="650">Rejected before HTTP</text>
<rect class="bad" x="30" y="398" width="140" height="32" rx="6"/><text class="m" x="100" y="419" text-anchor="middle">allOf, oneOf</text>
<rect class="bad" x="180" y="398" width="170" height="32" rx="6"/><text class="m" x="265" y="419" text-anchor="middle">anyOf at the root</text>
<rect class="bad" x="360" y="398" width="250" height="32" rx="6"/><text class="m" x="485" y="419" text-anchor="middle">external or unresolved $ref</text>
<rect class="bad" x="620" y="398" width="350" height="32" rx="6"/><text class="t" x="795" y="419" text-anchor="middle">any broken rule above</text>
<!-- wire -->
<text class="s tx" x="30" y="464" font-weight="650">On the wire</text>
<rect class="ext" x="30" y="476" width="460" height="44" rx="8"/>
<text x="46" y="503"><tspan class="t">Chat Completions</tspan><tspan class="m" dx="12">tools[].function.strict</tspan></text>
<rect class="ext" x="510" y="476" width="460" height="44" rx="8"/>
<text x="526" y="503"><tspan class="t">Responses</tspan><tspan class="s" dx="4">(experimental)</tspan><tspan class="m" dx="12">tools[].strict</tspan></text>
</svg>
