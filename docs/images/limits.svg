<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="1000" role="img" aria-labelledby="title">
<title id="title">Which size, time and state limit applies to each part of a request and its SSE stream</title>
<style>
:root{--bg:#FAFBF7;--ink:#1D2719;--muted:#5C6857;--line:#7C8876;--card:#FFFFFF;--lib:#E4F1D6;--libs:#3D7A18;--ext:#E9EDF7;--exts:#43558F;--spr:#EFF0EA;--sprs:#6B705F;--bad:#FBE6DF;--bads:#B23B1E;--warn:#FFF2CC;--warns:#946400}
@media (prefers-color-scheme:dark){:root{--bg:#141A11;--ink:#E2E9DA;--muted:#A0AB9A;--line:#7F8A79;--card:#1C2418;--lib:#22351A;--libs:#82C64A;--ext:#1D2337;--exts:#93A3E0;--spr:#23281F;--sprs:#A3A894;--bad:#3A1D16;--bads:#EE8466;--warn:#352A0C;--warns:#E3B54A}}
text{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.lib{fill:var(--lib);stroke:var(--libs);stroke-width:1.4}
.ext{fill:var(--ext);stroke:var(--exts);stroke-width:1.4}
.spr{fill:var(--spr);stroke:var(--sprs);stroke-width:1.4}
.bad{fill:var(--bad);stroke:var(--bads);stroke-width:1.4}
.warn{fill:var(--warn);stroke:var(--warns);stroke-width:1.4}
.grp{fill:none;stroke:var(--libs);stroke-width:1.3;stroke-dasharray:5 4}
.grpx{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.h{font-size:15px;font-weight:650}
.t{font-size:14px}
.s{font-size:12.5px;fill:var(--muted)}
.m,.mb{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:12.5px}
.mb{font-weight:700}
.tl{fill:var(--libs)}.tx{fill:var(--exts)}.tb{fill:var(--bads)}.tw{fill:var(--warns)}.tm{fill:var(--muted)}
.arr{fill:none;stroke:var(--line);stroke-width:1.6}
.arr.g{stroke:var(--libs)}.arr.r{stroke:var(--bads)}.arr.x{stroke:var(--exts)}
.dash{stroke-dasharray:5 4}
.ah{fill:var(--line)}.ahg{fill:var(--libs)}.ahr{fill:var(--bads)}.ahx{fill:var(--exts)}
.rule{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahg" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahr" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahx" d="M0,0.8 L9.5,5 L0,9.2 L2.6,5 z"/></marker>
</defs>
<rect class="bg" width="1000" height="562" rx="14"/>
<g transform="translate(0,-18)">
<!-- request -->
<text class="h" x="20" y="73">request</text>
<rect class="card" x="190" y="48" width="250" height="40" rx="8"/>
<text class="s" x="206" y="73" style="fill:var(--ink)">JSON body</text>
<rect class="lib" x="300" y="56" width="128" height="24" rx="6"/>
<text class="s" x="364" y="72.5" text-anchor="middle" style="fill:var(--ink)">inline attachment</text>
<text class="mb" x="460" y="66">1 byte – 20 MiB</text>
<text class="s" x="460" y="83">each inline attachment, decoded size</text>
<line class="rule" x1="20" y1="104" x2="980" y2="104"/>
<!-- blocking -->
<text class="h" x="20" y="160">blocking call</text>
<text class="s" x="20" y="178">response</text>
<path class="rule" d="M190 136 V128 H610 V136" style="fill:none;opacity:1"/>
<text x="400" y="121" text-anchor="middle"><tspan class="m">max-response-body-size</tspan><tspan class="mb" dx="6">64MB</tspan></text>
<rect class="lib" x="190" y="142" width="420" height="32" rx="6"/>
<text class="s" x="400" y="162.5" text-anchor="middle" style="fill:var(--ink)">one response body</text>
<path class="rule" d="M640 136 V128 H820 V136" style="fill:none;opacity:1"/>
<text x="730" y="121" text-anchor="middle"><tspan class="m">max-error-body-size</tspan><tspan class="mb" dx="6">64KB</tspan></text>
<rect class="bad" x="640" y="142" width="180" height="32" rx="6"/>
<text class="s" x="730" y="162.5" text-anchor="middle" style="fill:var(--ink)">error body, calls and streams</text>
<text class="s" x="190" y="198">Boot: <tspan class="m" style="fill:var(--muted)">connection.timeout</tspan> (2m) also sets the connect and read timeouts</text>
<line class="rule" x1="20" y1="214" x2="980" y2="214"/>
<!-- stream -->
<text class="h" x="20" y="268">SSE stream</text>
<text class="s" x="20" y="286">chat, Responses, images</text>
<line class="rule" x1="190" y1="262" x2="845" y2="262" style="opacity:.8"/>
<rect class="lib" x="190" y="246" width="60" height="32" rx="5"/>
<rect class="lib" x="270" y="246" width="80" height="32" rx="5"/>
<path class="rule" d="M270 242 V236 H350 V242" style="fill:none;opacity:1"/>
<text class="s" x="310" y="230" text-anchor="middle" style="fill:var(--ink)">each event ≤ 64MB</text>
<rect class="card" x="420" y="250" width="14" height="24" rx="3"/>
<text class="s" x="427" y="236" text-anchor="middle">keepalive</text>
<rect class="lib" x="520" y="246" width="70" height="32" rx="5"/>
<rect class="lib" x="610" y="246" width="60" height="32" rx="5"/>
<rect class="lib" x="690" y="246" width="60" height="32" rx="5"/>
<rect class="card" x="775" y="248" width="70" height="28" rx="5"/>
<text class="m" x="810" y="266.5" text-anchor="middle">[DONE]</text>
<path class="rule" d="M434 284 V292 H520 V284" style="fill:none;opacity:1"/>
<text class="s" x="477" y="309" text-anchor="middle" style="fill:var(--ink)">idle gap ≤ 2m</text>
<text class="m" x="477" y="325" text-anchor="middle" style="fill:var(--muted)">connection.timeout</text>
<text class="s" x="860" y="260">no cap on the</text>
<text class="s" x="860" y="276">total stream size</text>
<!-- state budgets -->
<text class="h" x="20" y="400">stream state</text>
<text class="s" x="20" y="418">budget per</text>
<text class="s" x="20" y="434">subscription</text>
<text class="s tl" x="190" y="362" font-weight="650">what the library keeps in memory while it assembles a stream</text>
<rect class="lib" x="190" y="374" width="650" height="30" rx="6"/>
<text x="202" y="394"><tspan class="mb">Chat Completions</tspan><tspan class="s" dx="10" style="fill:var(--ink)">1MB retained metadata · 128 active choices</tspan></text>
<text class="m" x="828" y="394" text-anchor="end" style="fill:var(--libs)">chat.streaming-state.*</text>
<rect class="lib" x="190" y="412" width="650" height="30" rx="6"/>
<text x="202" y="432"><tspan class="mb">Responses</tspan><tspan class="s" dx="10" style="fill:var(--ink)">1MB · 1024 events · 2m wall clock</tspan></text>
<text class="m" x="828" y="432" text-anchor="end" style="fill:var(--libs)">chat.tool-call-aggregation.*</text>
<text class="s" x="202" y="460">The 2m starts at the first state-bearing event. Keepalives do not reset it.</text>
<rect class="lib" x="190" y="470" width="650" height="30" rx="6"/>
<text x="202" y="490"><tspan class="mb">chat audio</tspan><tspan class="s" dx="10" style="fill:var(--ink)">16 MiB audio + transcript · 128 audio choices</tspan></text>
<text class="s" x="828" y="490" text-anchor="end">fixed</text>
<line class="rule" x1="20" y1="518" x2="980" y2="518"/>
<text x="20" y="544"><tspan class="s tb" font-weight="650">over a state budget or the error-body cap</tspan><tspan class="m" dx="8">OpenRouterLimitExceededException</tspan></text>
<text class="s" x="20" y="566">Chat audio raises <tspan class="m" style="fill:var(--muted)">NonTransientAiException</tspan>. An SSE event over 64MB raises <tspan class="m" style="fill:var(--muted)">DataBufferLimitException</tspan>. Nothing is truncated silently.</text>
</g>
</svg>
